<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
    content="
        default-src 'none'; 
        style-src {{cspSource}} 'nonce-{{nonce}}'; 
        script-src {{cspSource}} 'nonce-{{nonce}}';
        font-src {{cspSource}} 'nonce-{{nonce}}';
    ">
    <link href="{{styleUri}}" rel="stylesheet">
    <link href="{{codiconUri}}" rel="stylesheet">
</head>
<body>
    <!-- 1. 서버 상태 확인 카드 -->
    <div class="card" id="server-status">
        <div class="card-header">
            <span><i id="server-status-icon" class="codicon codicon-vm"></i> &nbsp; 서버 상태 확인</span>
            <button id="reconnect-btn" class="icon-btn" title="재연결">
                <i class="codicon codicon-sync"></i>
            </button>
        </div>
        <div class="status-row">
            <span id="backend-status">🟡 Server Connecting...</span>
        </div>
        <div class="status-row">
            <i class="codicon codicon-plug"></i> &nbsp; <span id="endpoint"> </span>
            <input type="text" id="endpoint-edit-input" class="hidden">
            <button id="change-endpoint" class="icon-btn hidden"><i class="codicon codicon-pass"></i></button>
            <button id="cancel-endpoint" class="icon-btn hidden"><i class="codicon codicon-close"></i></button>
        </div>
        <div class="status-row">
            <i class="codicon codicon-hubot"></i>
            <select id="model-list-scroll"></select>
        </div>
    </div>

    <!-- 2. 현재 프로젝트 정보 카드 (서버 상태 확인 제외함) -->
    <div class="card" id="project-info">
        <div class="card-header">
            <span><i class="codicon codicon-files"></i> &nbsp; 현재 프로젝트 정보</span>
        </div>
        <div id="current-project-info" class="project-info-box">
            <div id="current-project-name">없음</div>
            <div><i class="codicon codicon-folder-active"></i>&nbsp;
                <span id="current-project-path"></span>
            </div>
            <div id="current-git-info"></div>
        </div>
    </div>

    <!-- 3. 프로젝트 목록 카드 -->
    <div class="card" id="project-list" style="display: flex; flex-direction: column; flex: 1; min-height: 200px;">
        <div class="card-header">
            <span><i class="codicon codicon-list-unordered"></i> &nbsp; 프로젝트 목록</span>
            <button id="refresh-projects-btn" class="icon-btn" title="목록 새로고침">
                <i class="codicon codicon-sync"></i>
            </button>
        </div>
        
        <!-- 자바스크립트가 안전하게 아코디언 목록을 그려 넣을 영역 -->
        <div id="project-list-content" class="project-list" style="margin-top: 6px; flex: 1; overflow-y: auto;">
            <div style="padding: 4px 0; opacity: 0.8;">• 프로젝트 목록을 불러오는 중...</div>
        </div>
    </div>

    <!-- 💡 4. 가이드북 켜기/끄기 토글 버튼 -->
    <div class="card" id="guide-toggle">
        <button id="toggle-guide-btn" class="icon-btn block-btn" title="Vision Guide 열기/닫기">
            <i class="codicon codicon-book"></i> Vision Guide <span id="GuideStatus"></span>
        </button>
        <button id="project-brief-btn" class="icon-btn block-btn" title="프로젝트 브리핑 생성">
            <i class="codicon codicon-comment-unresolved"></i> Copilot ─ 프로젝트 브리핑
        </button>
        <button id="gen-RAGTEST-btn" class="icon-btn" title="RAG_TEST 생성">
            <i class="codicon codicon-beaker"></i> Copilot ─ RAG_TEST 생성: No.
        </button>
        <select id="testN" name="N">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>


    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
