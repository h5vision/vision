<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" 
    content="
        default-src 'none'; 
        style-src {{cspSource}} 'nonce-{{nonce}}'; 
        script-src {{cspSource}} 'nonce-{{nonce}}';
        font-src {{cspSource}} 'nonce-{{nonce}}';
    ">
    <link href="{{styleUri}}" rel="stylesheet">
    <link href="{{codiconUri}}" rel="stylesheet">
</head>
<body>
    <!-- 1. 서버 상태 확인 카드 -->
    <div class="card">
        <div class="card-header">
            <span><i class="codicon codicon-vm"></i> 서버 상태 확인</span>
            <button id="reconnect-btn" class="icon-btn" title="재연결">🔄</button>
        </div>
        <div class="status-row">
            <span id="backend-status">🟡 Server Connecting...</span>
        </div>
        <div class="status-row">
            <i class="codicon codicon-plug"></i> &nbsp; <span id="endpoint">http://localhost:8000</span>
            <button id="edit-endpoint-btn" class="icon-btn" title="주소 변경"><i class="codicon codicon-edit"></i></button>
        </div>
        <div class="status-row">
            <i class="codicon codicon-hubot"></i> &nbsp; <span> 모델: <span class="badge">Llama-3-Instruct-8B</span></span>
        </div>
    </div>

    <!-- 2. 현재 프로젝트 정보 카드 (서버 상태 확인 제외함) -->
    <div class="card">
        <div class="card-header">
            <span>📊 현재 프로젝트 정보</span>
        </div>
        <div id="current-project-info" class="project-info-box">
            <div>• 선택된 프로젝트: <b id="project-current">없음</b></div>
            <div>• git 정보: <b id="project-current-git"></b></div>
            <div style="font-size: 11px; margin-top: 4px; opacity: 0.7;">• 경로: -</div>
        </div>
    </div>

    <!-- 2. 프로젝트 목록 카드 (기존 인덱싱 및 히스토리 자리 대체) -->
    <div class="card">
        <div class="card-header">
            <span>📁 프로젝트 목록</span>
            <button id="refresh-projects-btn" class="icon-btn" title="목록 새로고침" style="font-size: 11px; padding: 2px 6px; cursor: pointer;">🔄 새로고침</button>
        </div>
        <div class="project-list" style="margin-top:6px;">
            현재 프로젝트: <span id="project-current"></span>
        </div>
        <div id="project-list-content" class="project-list" style="margin-top: 6px;">
            <div style="padding: 4px 0; opacity: 0.8;">• 등록된 프로젝트 목록이 없습니다.</div>
        </div>
    </div>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
